<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ПЕРИМЕТР — защита сети</title>
<style>
  :root{
    --bg:#070b11; --panel:#0e1520; --panel2:#0b121b; --line:#1c2a3a;
    --text:#d5e0ec; --muted:#7d8ea3;
    --accent:#f2b544; --ok:#3ddc84; --bad:#ff5f5f; --blue:#5aa9ff; --violet:#a48cff;
    --mono:"Consolas","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1100px 600px at 55% 0%, #0d1a2a 0%, #070b11 68%);
    color:var(--text);overflow:hidden;
    font:14px/1.4 "Segoe UI",system-ui,-apple-system,sans-serif;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#223143;border-radius:4px}
  ::-webkit-scrollbar-track{background:transparent}

  /* ---------- HUD ---------- */
  .hud{
    display:flex;align-items:center;gap:18px;height:58px;padding:0 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0f1a26,#0a1019);
  }
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .logo{color:var(--accent);font-size:20px}
  .bt{font-weight:700;letter-spacing:.22em;font-size:12px}
  .bs{font-size:10.5px;color:var(--muted)}
  .hud-mid{display:flex;align-items:center;gap:22px;margin-left:auto}
  .money{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .money .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted)}
  .money b{font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:500}
  .cia{display:flex;gap:12px}
  .cia-item{display:flex;align-items:center;gap:5px}
  .cia-l{font-size:10px;color:var(--muted);width:9px}
  .cia-bar{width:72px;height:6px;background:#16202c;border-radius:3px;overflow:hidden}
  .cia-bar i{display:block;height:100%;background:var(--ok);transition:width .4s ease, background .4s}
  .cia-v{font-family:var(--mono);font-size:11px;width:26px;text-align:right;color:#b9c7d8}
  .hud-right{display:flex;gap:7px}
  .btn{
    background:#17253a;border:1px solid #2a4060;border-radius:6px;
    padding:8px 14px;transition:.15s;white-space:nowrap;
  }
  .btn:hover:not(:disabled){background:#1e3049;border-color:#3d5c82}
  .btn:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:transparent}
  .btn.primary{background:var(--accent);color:#161a20;border-color:var(--accent);font-weight:700}
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}

  /* ---------- Раскладка ---------- */
  .grid{
    display:grid;grid-template-columns:300px minmax(0,1fr);
    gap:8px;padding:8px;height:calc(100vh - 58px);
  }
  .col{display:flex;flex-direction:column;gap:8px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px}
  .panel h2{
    margin:0 0 9px;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.15em;color:var(--muted);font-weight:600;
  }
  .grow{flex:1;min-height:0;overflow:auto}
  .intel{max-height:54vh;overflow:auto}

  /* ---------- Разведка ---------- */
  .threat{
    background:#111a25;border:1px solid #24384e;border-left:3px solid var(--bad);
    border-radius:7px;padding:9px 10px;margin-bottom:8px;
  }
  .th-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .code{
    font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    background:#2a0f12;border:1px solid #5a2026;color:#ff9c9c;
    padding:1px 6px;border-radius:4px;
  }
  .hp{font-family:var(--mono);font-size:10px;color:var(--muted)}
  .th-name{font-size:13px;margin-top:5px}
  .th-path{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
  .th-desc{font-size:11px;color:#93a4b8;margin-top:5px}
  .th-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);
    margin-top:6px;font-family:var(--mono)}
  .tchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
  .tchip{
    font-size:9px;letter-spacing:.02em;color:#9db0c6;
    border:1px solid #2b3f57;background:#0f1a26;border-radius:3px;padding:1px 5px;
  }
  .tchip.phys{color:#ffc49a;border-color:#5a3d28;background:#1c140e}
  .tchip.hw{color:#8fe3d6;border-color:#2f6f7a;background:#0c1a1d}
  .none{color:var(--muted);font-size:12px}

  /* ---------- Журнал ---------- */
  .log{display:flex;flex-direction:column;gap:5px;font-size:11px}
  .log-item{display:flex;gap:6px;color:var(--muted);line-height:1.35}
  .log-t{font-family:var(--mono);color:#41556c;flex-shrink:0}
  .log-item.ok .log-x{color:var(--ok)}
  .log-item.bad .log-x{color:var(--bad)}
  .log-item.warn .log-x{color:var(--accent)}

  /* ---------- Карта ---------- */
  .stage{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
  .mapwrap{
    position:relative;flex:1;min-height:260px;border:1px solid var(--line);
    border-radius:10px;overflow:hidden;background:#0a1119;
    background-image:
      linear-gradient(rgba(22,38,56,.55) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,38,56,.55) 1px, transparent 1px);
    background-size:42px 42px;
  }
  #map{width:100%;height:100%;display:block}
  .map-legend{
    position:absolute;top:10px;left:12px;z-index:2;pointer-events:none;
    font-size:10px;color:#7d8ea3;letter-spacing:.02em;
    background:rgba(9,16,24,.78);border:1px solid #1c2a3a;border-radius:5px;
    padding:3px 8px;
  }
  .map-legend b{color:#ff8a8a;font-weight:500}
  .view-toggle{position:absolute;top:9px;right:11px;z-index:3;display:flex;gap:4px}
  .vt{
    font-size:10.5px;padding:3px 9px;border-radius:5px;
    border:1px solid #26374b;background:#0d151f;color:#8fa2b8;
  }
  .vt:hover{color:#dbe6f2;border-color:#3a5674}
  .vt.on{background:#1a2536;border-color:#3d5c82;color:#dbe6f2}
  .lane-label{fill:#8a6a52;font-size:9.5px;letter-spacing:.16em;text-anchor:middle}
  .lane-label.hw{fill:#4f8f9a}

  .edge{stroke:#1d2f44;stroke-width:2}
  .edge-flow{stroke:#2c4d6e;stroke-width:2;stroke-dasharray:4 11;opacity:.5;animation:flow 9s linear infinite}
  .edge.hot{stroke:#5c2a31}
  .edge-flow.hot{stroke:#ff5f5f;opacity:.75}
  @keyframes flow{to{stroke-dashoffset:-150}}

  .node{cursor:pointer}
  .node .nbox{fill:#0f1a27;stroke:#25394f;stroke-width:1.5;transition:stroke .15s, filter .15s}
  .node:hover .nbox{stroke:#3f6488}
  .node.sel .nbox{stroke:var(--accent);stroke-width:2;filter:drop-shadow(0 0 8px rgba(242,181,68,.35))}
  .node.t-ext .nbox{fill:#160f13;stroke:#5c2a31}
  .node.t-street .nbox{fill:#181210;stroke:#7a4b2a}
  .node.t-dmz .nbox{fill:#0d1723;stroke:#2b527a}
  .node.t-zone .nbox{fill:#15130a;stroke:#64501f}
  .node.t-host .nbox{fill:#0c1713;stroke:#245a3f}
  .node.t-data .nbox{fill:#120f1c;stroke:#453879}
  .node.t-branch .nbox{fill:#0b1517;stroke:#225953}
  .node.t-phys .nbox{fill:#17110b;stroke:#7a5426}
  .node.t-hw .nbox{fill:#0c181c;stroke:#2f6f7a}
  .node.t-ai .nbox{fill:#171022;stroke:#6a4a8a}
  .n-name{fill:#dfe9f4;font-size:13px;text-anchor:middle;font-weight:600}
  .n-sub{fill:#7d8ea3;font-size:9px;text-anchor:middle;letter-spacing:.02em}
  .node.hint .nbox{animation:hintPulse 1.7s ease-in-out infinite}
  @keyframes hintPulse{
    0%,100%{stroke:#64501f}
    50%{stroke:var(--accent);filter:drop-shadow(0 0 10px rgba(242,181,68,.45))}
  }
  .badge rect{fill:#0d1b16;stroke:#3ddc8477}
  .badge text{fill:#7ef0b0;font-size:8.5px;text-anchor:middle;font-family:var(--mono)}

  .token circle{fill:#2a0b0b;stroke:var(--bad);stroke-width:1.5;
    filter:drop-shadow(0 0 7px rgba(255,95,95,.55))}
  .token text{fill:#ffc0c0;font-size:10px;text-anchor:middle;font-family:var(--mono)}
  .token{transition:transform .42s linear}
  .token.done{opacity:0;transition:opacity .3s}

  .float{font-family:var(--mono);font-size:14px;text-anchor:middle;
    animation:floatUp .95s ease forwards;pointer-events:none}
  .float.def{fill:#7ef0b0}
  .float.c{fill:#ff9c9c}
  .float.i{fill:#ffc46b}
  .float.a{fill:#8fb6ff}
  @keyframes floatUp{
    from{opacity:0;transform:translateY(8px)}
    20%{opacity:1}
    to{opacity:0;transform:translateY(-30px)}
  }
  .node.hit .nbox{animation:hitFlash .45s ease}
  @keyframes hitFlash{
    0%{stroke:var(--ok);stroke-width:3}
    100%{stroke:#25394f;stroke-width:1.5}
  }
  .node.breach .nbox{animation:breachFlash .6s ease}
  @keyframes breachFlash{
    0%{stroke:var(--bad);stroke-width:3;fill:#2a0d0d}
    100%{stroke:#25394f;stroke-width:1.5;fill:#0f1a27}
  }

  /* ---------- Инспектор ---------- */
  .inspector{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:8px 11px;min-height:46px;font-size:12px;
  }
  .inspector .hint{color:var(--muted)}
  .schip{
    display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;
    background:#0c1a14;border:1px solid #2b5a41;color:#8fe7b8;
    border-radius:4px;padding:2px 4px 2px 7px;
  }
  .schip button{
    background:transparent;border:none;color:#5f9c7c;font-size:12px;line-height:1;
    padding:0 2px;
  }
  .schip button:hover{color:var(--bad)}

  /* ---------- Арсенал ---------- */
  .arsenal-wrap{
    background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px;
    display:flex;flex-direction:column;gap:6px;
  }
  .cats{display:flex;gap:5px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}
  .cat{
    font-size:10.5px;padding:2px 9px;border-radius:20px;white-space:nowrap;
    border:1px solid var(--line);background:transparent;color:var(--muted);
  }
  .cat:hover{color:var(--text);border-color:#3a5674}
  .cat.on{background:#1a2536;border-color:#3d5c82;color:var(--text)}
  .arsenal{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));
    gap:6px;max-height:172px;overflow:auto;
  }
  .tool{
    background:#101a26;border:1px solid #22344a;border-left:3px solid var(--cc,#5aa9ff);
    border-radius:7px;padding:7px 8px;text-align:left;transition:.13s;
  }
  .tool:hover{border-color:#3d6288;transform:translateY(-1px)}
  .t-top{display:flex;justify-content:space-between;align-items:center}
  .t-code{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;color:#9fc0e0}
  .t-cost{font-family:var(--mono);font-size:11px;color:var(--accent)}
  .t-name{font-size:11.5px;margin:3px 0 2px;line-height:1.2}
  .t-eff{font-size:9.5px;color:var(--muted);line-height:1.35}

  /* ---------- Модалки ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(3,6,10,.82);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .modal{
    background:#0f1723;border:1px solid #2a3f57;border-radius:11px;
    padding:22px;max-width:620px;width:100%;max-height:88vh;overflow:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.6);
  }
  .modal h2{margin:2px 0 8px;font-size:20px}
  .modal p{margin:0 0 12px;font-size:13.5px;color:#b6c3d3}
  .kicker{font-size:9.5px;letter-spacing:.2em;color:var(--accent);margin-bottom:6px}
  .steps{display:flex;flex-direction:column;gap:11px;margin:14px 0}
  .step{display:flex;gap:11px}
  .step-n{
    width:24px;height:24px;border-radius:50%;flex-shrink:0;
    background:#1a1710;border:1px solid #5a4517;color:var(--accent);
    font-family:var(--mono);font-size:12px;line-height:23px;text-align:center;
  }
  .step-t{font-size:12.5px;color:#b6c3d3;line-height:1.45}
  .step-t b{color:var(--text)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}

  .about{font-size:13px;color:#b6c3d3;line-height:1.5}
  .eff{display:flex;flex-direction:column;gap:0;margin-top:4px}
  .eff-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
    border-bottom:1px solid #17212d;font-size:12.5px}
  .eff-row b{font-family:var(--mono);color:var(--ok);font-weight:500}
  .meta-line{font-size:11.5px;color:var(--muted);margin-top:12px}

  .res-row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
    border-bottom:1px solid #17212d;font-size:12.5px}
  .res-row .ok{color:var(--ok)}
  .res-row .bad{color:var(--bad)}
  .lesson{
    margin:14px 0;padding:10px 12px;border-left:2px solid var(--accent);
    background:#1a1710;color:#e8c98a;font-size:12.5px;
  }
  .lesson b{display:block;font-size:9px;letter-spacing:.14em;margin-bottom:4px;color:var(--accent)}
  .score{display:flex;gap:18px;align-items:baseline;margin:6px 0 14px}
  .score b{font-family:var(--mono);font-size:44px;color:var(--accent);font-weight:500;line-height:1}
  .score span{font-size:13px;color:var(--muted)}

  #toasts{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    display:flex;flex-direction:column;gap:7px;z-index:80;align-items:center;width:min(520px,92vw)}
  .toast{
    background:#16212f;border:1px solid #33475f;border-left:3px solid var(--blue);
    padding:8px 14px;border-radius:6px;font-size:12.5px;
    box-shadow:0 10px 26px rgba(0,0,0,.5);
  }
  .toast.bad{border-left-color:var(--bad)}

  @media (max-width:1100px){
    .grid{grid-template-columns:260px minmax(0,1fr)}
    .cia-bar{width:56px}
  }
  @media (max-width:860px){
    body{overflow:auto}
    .grid{grid-template-columns:1fr;height:auto}
    .hud{flex-wrap:wrap;height:auto;padding:9px 12px;gap:10px}
    .hud-mid{margin-left:0;flex-wrap:wrap;gap:14px}
    .mapwrap{height:56vh;min-height:360px}
    .arsenal{max-height:none}
    .col{min-height:0}
  }
</style>
</head>
<body>

<header class="hud">
  <div class="brand">
    <span class="logo">◈</span>
    <div>
      <div class="bt">ПЕРИМЕТР</div>
      <div class="bs">Смена 1 · волна <span id="waveNum">1</span> из <span id="waveTotal">30</span></div>
    </div>
  </div>
  <div class="hud-mid">
    <div class="money"><span class="lbl">Бюджет</span><b id="money">80 ₽</b></div>
    <div class="cia" id="cia"></div>
    <button class="btn ghost" id="repairBtn" data-act="repair" title="Восстановить К/Ц/Д на 15 пунктов">Ремонт 30 ₽</button>
  </div>
  <div class="hud-right">
    <button class="btn ghost" data-act="help" title="Правила">?</button>
    <button class="btn primary" id="startBtn" data-act="start-wave">Начать волну</button>
  </div>
</header>

<main class="grid">
  <aside class="col">
    <section class="panel intel">
      <h2>Разведка · волна <span id="intelWave">1</span></h2>
      <div id="intel"></div>
    </section>
    <section class="panel grow">
      <h2>Журнал</h2>
      <div class="log" id="log"></div>
    </section>
  </aside>

  <section class="stage">
    <div class="mapwrap">
      <div class="map-legend"><b>красным</b> — маршрут атаки · клик по узлу — выбрать</div>
      <div class="view-toggle" id="viewToggle"></div>
      <svg id="map" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="inspector" id="inspector"></div>
    <div class="arsenal-wrap">
      <div class="cats" id="cats"></div>
      <div class="arsenal" id="arsenal"></div>
    </div>
  </section>
</main>

<div id="modal-root"></div>
<div id="toasts"></div>

<script>
"use strict";

/* ============================ ДАННЫЕ ============================ */

const NODES = {
  inet:   { name:"Интернет",   sub:"внешняя сеть",       slots:0, type:"ext",    views:["net","hw"] },
  perim:  { name:"Периметр",   sub:"межсетевой экран",   slots:2, type:"zone",   views:["net"] },
  web:    { name:"Веб-сервер", sub:"DMZ",                slots:2, type:"dmz",    views:["net"] },
  core:   { name:"Ядро сети",  sub:"сегментация",        slots:3, type:"zone",   views:["net"] },
  arm:    { name:"АРМ",        sub:"рабочие места",      slots:3, type:"host",   views:["net"] },
  db:     { name:"1С / БД",    sub:"критичный актив",    slots:3, type:"data",   views:["net"] },
  backup: { name:"Бэкап",      sub:"резервные копии",    slots:1, type:"data",   views:["net"] },
  branch: { name:"Филиал",     sub:"канал связи",        slots:1, type:"branch", views:["net"] },
  ai:     { name:"ИИ-сервис",  sub:"модель и данные",    slots:2, type:"ai",     views:["net"] },
  street: { name:"Улица",      sub:"физический доступ",  slots:2, type:"street", views:["net","hw"] },
  office: { name:"Офис",       sub:"помещения",          slots:5, type:"phys",   views:["net","hw"] },
  server: { name:"Серверная",  sub:"стойка с серверами", slots:2, type:"phys",   views:["net","hw"] },
  bios:   { name:"Прошивка",   sub:"BIOS / UEFI",        slots:2, type:"hw",     views:["hw"] },
  boot:   { name:"Загрузчик",  sub:"boot loader",        slots:2, type:"hw",     views:["hw"] },
  kernel: { name:"Ядро ОС",    sub:"kernel",             slots:2, type:"hw",     views:["hw"] },
  pcie:   { name:"PCIe / TB",  sub:"шина и Thunderbolt", slots:1, type:"hw",     views:["hw"] },
  usb:    { name:"USB / периферия", sub:"порты",         slots:2, type:"hw",     views:["hw"] },
  updates:{ name:"Обновления", sub:"канал обновлений",   slots:1, type:"hw",     views:["hw"] },
};

const POS = {
  net: {
    inet:[65,330], perim:[215,330], web:[390,175], core:[390,435],
    arm:[640,300], db:[640,505], backup:[820,595], branch:[150,560],
    ai:[410,598],
    street:[905,90], office:[905,255], server:[905,425],
  },
  hw: {
    inet:[70,120], updates:[280,120],
    street:[70,380], office:[280,380], server:[490,380],
    bios:[720,110], boot:[720,245], kernel:[720,380],
    pcie:[900,245], usb:[630,575],
  },
};

const EDGES = {
  net: [
    ["inet","perim"], ["perim","web"], ["perim","core"], ["web","core"],
    ["core","arm"], ["core","db"], ["arm","db"], ["db","backup"], ["branch","core"],
    ["core","ai"],
    ["street","office"], ["office","server"], ["office","arm"], ["server","db"],
  ],
  hw: [
    ["inet","updates"], ["updates","kernel"],
    ["street","office"], ["office","server"],
    ["server","bios"], ["bios","boot"], ["boot","kernel"],
    ["server","pcie"], ["pcie","kernel"],
    ["office","usb"], ["usb","kernel"],
  ],
};

const ATTACKS = {
  exploit: { code:"EX", name:"Эксплойт веб-приложения", hp:2, prop:"c", dmg:20, layer:"net",
    lesson:"Эксплойт идёт по сети и упирается в периметр. Веб-приложение — входная точка, встречать атаку лучше раньше.",
    short:"эксплойт", vector:"Внешняя сеть", cls:"Внедрение кода",
    path:["inet","perim","web"],
    desc:"Поиск уязвимости и выполнение кода на веб-сервере." },

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
function clockStr(){
  const t = 9 * 60 + state.minutes;
  return String(Math.floor(t / 60) % 24).padStart(2,"0") + ":" + String(t % 60).padStart(2,"0");
}
function log(kind, text){
  state.log.unshift({ kind, text, t: clockStr() });
  state.log = state.log.slice(0, 30);
}

function renderAll(){
  renderHud();
  renderIntel();
  renderViewToggle();
  renderMap();
  renderInspector();
  renderCats();
  renderArsenal();
  renderLog();
}

function renderHud(){
  document.getElementById("money").textContent = state.budget + " ₽";
  document.getElementById("waveNum").textContent = Math.min(state.wave + 1, WAVES.length);
  document.getElementById("waveTotal").textContent = WAVES.length;
  document.getElementById("intelWave").textContent = Math.min(state.wave + 1, WAVES.length);

  const items = [["c","К"],["i","Ц"],["a","Д"]];
  document.getElementById("cia").innerHTML = items.map(([k, l]) => {
    const v = Math.max(0, state.cia[k]);
    const col = v > 60 ? "var(--ok)" : v > 30 ? "var(--accent)" : "var(--bad)";
    return '<div class="cia-item" title="' + PROP_FULL[k] + '">' +
      '<span class="cia-l">' + l + '</span>' +
      '<div class="cia-bar"><i style="width:' + v + '%;background:' + col + '"></i></div>' +
      '<span class="cia-v">' + v + '</span></div>';
  }).join("");

  const rb = document.getElementById("repairBtn");
  if(rb){
    const full = state.cia.c >= 100 && state.cia.i >= 100 && state.cia.a >= 100;
    rb.disabled = full || state.budget < 30 || state.phase !== "build";
  }

  const btn = document.getElementById("startBtn");
  btn.disabled = state.phase !== "build" || state.defeated || state.won;
  btn.textContent = state.phase === "resolve" ? "Идёт атака…"
    : state.won ? "Смена окончена" : state.defeated ? "Периметр пал" : "Начать волну";
}

function renderIntel(){
  const box = document.getElementById("intel");
  if(state.wave >= WAVES.length){
    box.innerHTML = '<div class="none">Все волны позади.</div>';
    return;
  }
  const wave = WAVES[state.wave];
  const hasHw = wave.atk.some(t => ATTACKS[t].layer === "hw");
  box.innerHTML = wave.atk.map(type => {
    const a = ATTACKS[type];
    const hp = Math.max(1, Math.round(a.hp * wave.hp));
    const dmg = Math.max(1, Math.round(a.dmg * wave.dmg));
    const path = a.path.map(id => NODES[id].name).join(" → ");
    const hw = a.layer === "hw";
    return '<div class="threat">' +
      '<div class="th-top"><span class="code">' + a.code + '</span>' +
      '<span class="hp">прочность ' + hp + '</span></div>' +
      '<div class="th-name">' + esc(a.name) + '</div>' +
      '<div class="tchips">' +
        '<span class="tchip' + (hw ? " hw" : "") + '">' + esc(a.vector) + '</span>' +
        '<span class="tchip">' + esc(a.cls) + '</span>' +
      '</div>' +
      '<div class="th-path">' + esc(path) + '</div>' +
      '<div class="th-desc">' + esc(a.desc) + '</div>' +
      '<div class="th-meta"><span>бьёт по: ' + PROP[a.prop] + '</span>' +
      '<span>урон: ' + dmg + '</span></div>' +
      '</div>';
  }).join("") +
  (hasHw && state.view !== "hw"
    ? '<div class="none">Часть атак — на аппаратном уровне. Переключите схему сверху.</div>'
    : "");
}

function renderViewToggle(){
  document.getElementById("viewToggle").innerHTML =
    '<button class="vt ' + (state.view === "net" ? "on" : "") + '" data-view="net">Сеть и объект</button>' +
    '<button class="vt ' + (state.view === "hw" ? "on" : "") + '" data-view="hw">Аппаратный уровень</button>';
}

function renderMap(){
  const svg = document.getElementById("map");
  const view = state.view;
  const pos = POS[view];
  const firstHints = state.wave === 0 && !Object.keys(state.placed).length;

  const hot = new Set();
  if(state.wave < WAVES.length){
    WAVES[state.wave].atk.forEach(t => {
      const a = ATTACKS[t];
      if(a.layer !== view) return;
      const p = a.path;
      for(let i = 0; i < p.length - 1; i++){
        hot.add(p[i] + "-" + p[i + 1]);
        hot.add(p[i + 1] + "-" + p[i]);
      }
    });
  }

  const edges = EDGES[view].map(([a, b]) => {
    const A = pos[a], B = pos[b];
    if(!A || !B) return "";
    const h = hot.has(a + "-" + b) ? " hot" : "";
    return '<line class="edge' + h + '" x1="' + A[0] + '" y1="' + A[1] + '" x2="' + B[0] + '" y2="' + B[1] + '"/>' +
      '<line class="edge-flow' + h + '" x1="' + A[0] + '" y1="' + A[1] + '" x2="' + B[0] + '" y2="' + B[1] + '"/>';
  }).join("");

  const nodes = Object.keys(NODES).filter(id => NODES[id].views.includes(view)).map(id => {
    const n = NODES[id];
    const p = pos[id];
    if(!p) return "";
    const inst = state.placed[id] || [];
    const sel = state.node === id ? " sel" : "";
    const hint = firstHints && id === "perim" ? " hint" : "";

    const badges = inst.map((t, i) => {
      const bx = -((inst.length - 1) * 30) / 2 + i * 30;
      return '<g class="badge" transform="translate(' + bx + ',40)">' +
        '<rect x="-14" y="-9" width="28" height="18" rx="4"/>' +
        '<text y="3">' + esc(TOOLS[t].code) + '</text></g>';
    }).join("");

    return '<g class="node t-' + n.type + sel + hint + '" data-node="' + id + '" transform="translate(' + p[0] + ',' + p[1] + ')">' +
      '<rect class="nbox" x="-62" y="-30" width="124" height="60" rx="10"/>' +
      '<text class="n-name" y="-3">' + esc(n.name) + '</text>' +
      '<text class="n-sub" y="15">' + esc(n.sub) + '</text>' +
      badges + '</g>';
  }).join("");

  const lane = view === "net"
    ? '<text class="lane-label" x="905" y="30">ФИЗИЧЕСКИЙ ПЕРИМЕТР</text>'
    : '<text class="lane-label hw" x="720" y="30">АППАРАТНЫЙ УРОВЕНЬ</text>';

  svg.innerHTML = edges + nodes + lane + '<g id="tokens"></g>';
}

function nodeKind(n){
  if(n.type === "hw") return "аппаратный узел";
  if(n.type === "ai") return "сервис";
  if(n.type === "phys") return "физический объект";
  if(n.type === "street") return "физическая точка входа";
  if(n.type === "ext") return "внешняя точка";
  return "узел сети";
}

function renderInspector(){
  const box = document.getElementById("inspector");
  if(state.phase === "resolve"){
    box.innerHTML = '<span class="hint">Атака идёт. Защита срабатывает на узлах по маршруту.</span>';
    return;
  }
  if(!state.node){
    const tip = state.wave === 0 && !Object.keys(state.placed).length
      ? "Для первой волны начните с узла «Периметр»."
      : "Выберите узел на схеме, затем средство защиты.";
    box.innerHTML = '<span class="hint">1. Узел → 2. Средство защиты → 3. Начать волну. ' + tip + '</span>';
    return;
  }
  const n = NODES[state.node];
  const inst = state.placed[state.node] || [];
  const chips = inst.length
    ? inst.map(t => '<span class="schip">' + esc(TOOLS[t].code) +
        '<button data-remove="' + state.node + ':' + t + '" title="Снять, вернуть половину">×</button></span>').join("")
    : '<span class="hint">пусто</span>';
  box.innerHTML = '<b>' + esc(n.name) + '</b>' +
    '<span class="hint">' + esc(nodeKind(n)) + ' · ' + inst.length + '/' + n.slots + ' слотов</span>' +
    chips +
    '<span class="hint" style="margin-left:auto">Выберите средство защиты ниже</span>';
}

function renderCats(){
  document.getElementById("cats").innerHTML = CAT_ORDER.map(([id, label]) =>
    '<button class="cat ' + (state.cat === id ? "on" : "") + '" data-cat="' + id + '">' + label + '</button>'
  ).join("");
}

function effLine(t){
  if(t.passive) return "снижает ущерб шифровальщика";
  return Object.entries(t.dmg)
    .filter(([, v]) => v > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([k, v]) => ATTACKS[k].short + " " + v)
    .join(" · ");
}

function renderArsenal(){
  const list = Object.entries(TOOLS).filter(([, t]) => state.cat === "all" || t.cat === state.cat);
  document.getElementById("arsenal").innerHTML = list.map(([id, t]) => {
    const cat = CATS[t.cat];
    return '<button class="tool" data-tool="' + id + '" style="--cc:' + cat.color + '" title="' + esc(t.name) + '">' +

function renderLog(){
  document.getElementById("log").innerHTML = state.log.slice(0, 14).map(e =>

/* ============================ ДЕЙСТВИЯ ============================ */

function selectNode(id){
  if(state.phase !== "build") return;
  state.node = state.node === id ? null : id;
  renderMap();
  renderInspector();
}

function canInstall(nodeId, toolId){
  const t = TOOLS[toolId];
  const inst = state.placed[nodeId] || [];
  if(inst.includes(toolId)) return { ok:false, reason:"Уже установлено на этом узле" };
  if(inst.length >= NODES[nodeId].slots) return { ok:false, reason:"На узле нет свободных слотов" };
  if(t.allow && !t.allow.includes(nodeId)) return { ok:false, reason:"Не подходит для этого узла" };
  if(state.budget < t.cost) return { ok:false, reason:"Не хватает " + (t.cost - state.budget) + " ₽" };
  return { ok:true };
}

function install(toolId){
  if(state.phase !== "build") return;
  const node = state.node;
  if(!node) return;
  const check = canInstall(node, toolId);
  if(!check.ok){ toast(check.reason, "bad"); return; }

  const t = TOOLS[toolId];
  state.budget -= t.cost;
  state.placed[node] = (state.placed[node] || []).concat(toolId);
  state.minutes += 2;
  log("ok", "Установлено: " + t.name + " → " + NODES[node].name);
  renderAll();
}

function removeTool(node, toolId){
  if(state.phase !== "build") return;
  const inst = state.placed[node] || [];
  const i = inst.indexOf(toolId);
  if(i < 0) return;
  inst.splice(i, 1);
  const refund = Math.round(TOOLS[toolId].cost / 2);
  state.budget += refund;
  state.minutes += 1;
  log("warn", "Снято: " + TOOLS[toolId].name + " (−" + NODES[node].name + ", +" + refund + " ₽)");
  renderAll();
}

function nodeDamage(nodeId, type){
  return (state.placed[nodeId] || []).reduce((s, t) => s + (TOOLS[t].dmg[type] || 0), 0);
}

function hasBackupOnPath(path){
  return path.some(id => (state.placed[id] || []).includes("bkp"));
}

function applyDamage(prop, amount){
  state.cia[prop] = Math.max(0, state.cia[prop] - amount);
  if(state.cia[prop] === 0) state.defeated = true;
}

function repair(){
  if(state.phase !== "build") return;
  const full = state.cia.c >= 100 && state.cia.i >= 100 && state.cia.a >= 100;
  if(full){ toast("Восстанавливать нечего."); return; }
  if(state.budget < 30){ toast("Не хватает бюджета.", "bad"); return; }
  state.budget -= 30;
  ["c","i","a"].forEach(k => { state.cia[k] = Math.min(100, state.cia[k] + 15); });
  state.minutes += 10;
  log("ok", "Ремонт: +15 К/Ц/Д за 30 ₽");
  renderAll();
}

/* ============================ ОПИСАНИЕ СРЕДСТВА ============================ */

function openTool(id){
  if(state.phase !== "build"){ toast("Идёт атака."); return; }
  state.infoTool = id;
  const t = TOOLS[id];
  const cat = CATS[t.cat];

  const eff = t.passive
    ? '<p class="about">Снижает ущерб от шифровальщика вдвое и помогает восстановить данные после волны.</p>'
    : '<div class="eff">' + Object.entries(t.dmg)
        .filter(([, v]) => v > 0)
        .sort((a, b) => b[1] - a[1])
        .map(([k, v]) => '<div class="eff-row"><span>' + esc(ATTACKS[k].name) + '</span><b>' + v + '</b></div>')
        .join("") + '</div>';

  let action;
  if(state.node){
    const check = canInstall(state.node, id);
    action = check.ok
      ? '<div class="modal-actions">' +
          '<button class="btn ghost" data-act="close">Закрыть</button>' +
          '<button class="btn primary" data-act="install-info">Установить на «' + esc(NODES[state.node].name) + '» — ' + t.cost + ' ₽</button>' +
        '</div>'
      : '<p class="meta-line">' + esc(check.reason) + '</p>' +
        '<div class="modal-actions"><button class="btn ghost" data-act="close">Закрыть</button></div>';
  } else {
    action = '<p class="meta-line">Чтобы установить, выберите узел на схеме.</p>' +
      '<div class="modal-actions"><button class="btn ghost" data-act="close">Закрыть</button></div>';
  }

  openModal(
    '<div class="kicker">' + esc(cat.name.toUpperCase()) + ' · СРЕДСТВО ЗАЩИТЫ</div>' +
    '<h2>' + esc(t.name) + '</h2>' +
    '<p class="about">' + esc(t.about) + '</p>' +
    '<div class="kicker" style="margin-top:14px">ЭФФЕКТИВНОСТЬ</div>' +
    eff +
    action
  );
}

/* ============================ АНИМАЦИЯ ============================ */

function floatText(nodePos, text, kind){
  const layer = document.getElementById("tokens");
  if(!layer) return;
  const el = document.createElementNS(NS, "text");
  el.setAttribute("x", nodePos[0]);
  el.setAttribute("y", nodePos[1] - 36);
  el.setAttribute("class", "float " + kind);
  el.textContent = text;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 950);
}

function pulse(nodeId, kind){
  const g = document.querySelector('[data-node="' + nodeId + '"]');
  if(!g) return;
  g.classList.add(kind);
  setTimeout(() => g.classList.remove(kind), 600);
}

async function runAttack(atk){
  const need = atk.layer === "hw" ? "hw" : "net";
  if(state.view !== need){
    state.view = need;
    renderAll();
    await sleep(280);
  }

  const layer = document.getElementById("tokens");
  if(!layer) return { atk, leaked:false, dmgToCia:0, stoppedAt:null };
  const pos = POS[state.view];

  const start = pos[atk.path[0]];
  const g = document.createElementNS(NS, "g");
  g.setAttribute("class", "token");
  g.style.transform = "translate(" + start[0] + "px," + start[1] + "px)";
  g.innerHTML = '<circle r="15"></circle><text y="4">' + atk.code + '</text>';
  layer.appendChild(g);
  await sleep(180);

  let hp = atk.hp;
  let stoppedAt = null;

  for(let i = 0; i < atk.path.length; i++){
    const id = atk.path[i];
    const p = pos[id];

    if(i > 0){
      g.style.transform = "translate(" + p[0] + "px," + p[1] + "px)";
      await sleep(450);
    }

    const dmg = nodeDamage(id, atk.type);
    if(dmg > 0){
      hp -= dmg;
      floatText(p, "−" + dmg, "def");
      pulse(id, "hit");
      log("ok", "СЗИ на «" + NODES[id].name + "»: −" + dmg + " к прочности атаки");
      await sleep(280);
      if(hp <= 0){ stoppedAt = id; break; }
    }
  }

  let leaked = false, dmgToCia = 0;
  if(hp > 0){
    leaked = true;
    const ratio = Math.max(0, hp) / atk.hp;
    dmgToCia = Math.max(1, Math.round(atk.dmg * ratio));
    if(atk.type === "ransom" && hasBackupOnPath(atk.path)){
      dmgToCia = Math.max(1, Math.round(dmgToCia / 2));
      log("warn", "Бэкап снизил ущерб от шифровальщика вдвое");
    }
    applyDamage(atk.prop, dmgToCia);
    floatText(pos[atk.path[atk.path.length - 1]], "−" + dmgToCia + " " + PROP[atk.prop], atk.prop);
    pulse(atk.path[atk.path.length - 1], "breach");
    log("bad", atk.name + ": прорыв, −" + dmgToCia + " " + PROP_FULL[atk.prop]);
    renderHud();
  } else {
    log("ok", atk.name + ": остановлен на «" + NODES[stoppedAt].name + "»");
  }

  g.classList.add("done");
  await sleep(320);
  g.remove();

  return { atk, hp, stoppedAt, leaked, dmgToCia };
}

/* ============================ ВОЛНЫ ============================ */

async function startWave(){
  if(state.phase !== "build" || state.defeated || state.won) return;

  state.phase = "resolve";
  state.node = null;
  state.minutes += 5;
  renderAll();
  log("warn", "Волна " + (state.wave + 1) + ": атака началась");
  renderLog();

  const wave = WAVES[state.wave];
  const results = [];

  for(const type of wave.atk){
    const base = ATTACKS[type];
    const hp = Math.max(1, Math.round(base.hp * wave.hp));
    const dmg = Math.max(1, Math.round(base.dmg * wave.dmg));
    const res = await runAttack({ ...base, type, hp, dmg });
    results.push(res);
    if(state.defeated) break;
  }

  state.phase = "build";
  renderHud();

  if(state.defeated){
    renderAll();
    showDefeat();
    return;
  }

  const damaged = results.some(r => r.leaked);
  state.wave++;

  if(state.wave >= WAVES.length){
    state.won = true;
    renderAll();
    showVictory();
    return;
  }

  const reward = 22 + (damaged ? 0 : 10);
  state.budget += reward;

  renderAll();
  showDebrief(results, reward, damaged);
}

function openModal(html, isStatic){
  document.getElementById("modal-root").innerHTML =
    '<div class="overlay"><div class="modal"' + (isStatic ? ' data-static="1"' : '') + '>' + html + '</div></div>';
}
function closeModal(){ document.getElementById("modal-root").innerHTML = ""; }

function toast(text, kind){
  const box = document.getElementById("toasts");
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = text;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function showDebrief(results, reward, damaged){
  const lessonAtk = results.find(r => r.leaked) || results[0];
  const lesson = ATTACKS[lessonAtk.atk.type].lesson;
  const rows = results.map(r => {
    const ok = !r.leaked;
    return '<div class="res-row"><span>' + esc(r.atk.name) + '</span>' +
      '<span class="' + (ok ? "ok" : "bad") + '">' +
      (ok ? "остановлен: " + esc(NODES[r.stoppedAt].name)
          : "прорыв: −" + r.dmgToCia + " " + PROP[r.atk.prop]) +
      '</span></div>';
  }).join("");

  openModal(
    '<div class="kicker">ИТОГ ВОЛНЫ ' + state.wave + '</div>' +
    '<h2>' + (damaged ? "Волна прорвана" : "Волна отбита") + '</h2>' +
    rows +
    '<div class="lesson"><b>УРОК</b>' + esc(lesson) + '</div>' +
    '<p class="none">Бюджет пополнен на ' + reward + ' ₽' +
      (damaged ? " (без бонуса за чистую волну)" : " (включая бонус за чистую волну)") + '.</p>' +
    '<div class="modal-actions"><button class="btn primary" data-act="close">Следующая волна</button></div>',
    true
  );
}

function showDefeat(){
  const prop = state.cia.c === 0 ? "c" : state.cia.i === 0 ? "i" : "a";

    '<div class="kicker">СМЕНА ПРОВАЛЕНА</div>' +

    '<p>Компания потеряла ' + PROP_FULL[prop] + '. Дальше работать нечем: инцидент перерос в остановку бизнеса.</p>' +
    '<p class="none">Волна ' + (state.wave + 1) + ' из ' + WAVES.length + '.</p>' +
    '<div class="modal-actions"><button class="btn primary" data-act="restart">Начать заново</button></div>',

  );
}

function showVictory(){
  const sum = state.cia.c + state.cia.i + state.cia.a;
  const score = sum + state.budget;
  const grade = score >= 480 ? "Отлично" : score >= 380 ? "Зачёт" : "На грани";

  openModal(
    '<div class="kicker">СМЕНА ЗАВЕРШЕНА</div>' +
    '<div class="score"><b>' + score + '</b><span>' + grade + ' · все ' + WAVES.length + ' волн позади</span></div>' +
    '<div class="res-row"><span>Конфиденциальность</span><span>' + state.cia.c + ' / 100</span></div>' +
    '<div class="res-row"><span>Целостность</span><span>' + state.cia.i + ' / 100</span></div>' +
    '<div class="res-row"><span>Доступность</span><span>' + state.cia.a + ' / 100</span></div>' +
    '<div class="res-row"><span>Остаток бюджета</span><span>' + state.budget + ' ₽</span></div>' +
    '<div class="lesson"><b>ГЛАВНОЕ</b>Не бывает одного средства от всего. Защита — это набор контролей по маршруту атаки. ' +
      'И не только в сети: прошивка, загрузчик и дверь серверной — тоже периметр.</div>' +
    '<div class="modal-actions"><button class="btn primary" data-act="restart">Сыграть заново</button></div>',
    true
  );
}

  );
}

/* ============================ СОБЫТИЯ ============================ */

document.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("overlay")){
    const m = e.target.querySelector(".modal");
    if(m && !m.dataset.static) closeModal();
  }

  const rm = e.target.closest("[data-remove]");
  if(rm){
    const parts = rm.dataset.remove.split(":");
    removeTool(parts[0], parts[1]);
    return;
  }

  const viewEl = e.target.closest("[data-view]");
  if(viewEl){
    state.view = viewEl.dataset.view;
    if(state.node && !NODES[state.node].views.includes(state.view)) state.node = null;
    renderAll();
    return;
  }

  const catEl = e.target.closest("[data-cat]");
  if(catEl){
    state.cat = catEl.dataset.cat;
    renderCats();
    renderArsenal();
    return;
  }

  const toolEl = e.target.closest("[data-tool]");
  if(toolEl){ openTool(toolEl.dataset.tool); return; }

  const nodeEl = e.target.closest("[data-node]");
  if(nodeEl){ selectNode(nodeEl.dataset.node); return; }

  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;

  if(act === "start-wave") startWave();
  else if(act === "repair") repair();
  else if(act === "help") helpModal(false);
  else if(act === "start"){ closeModal(); log("warn", "Смена начата. Периметр на вас."); renderAll(); }
  else if(act === "install-info"){
    if(state.infoTool){ install(state.infoTool); closeModal(); }
  }
  else if(act === "close") closeModal();
  else if(act === "restart") location.reload();
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape") closeModal();
});

/* ============================ СТАРТ ============================ */

renderAll();
helpModal(true);
</script>
</body>
</html>
