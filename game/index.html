<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Наследство админа — Дело 1 «Опись»</title>
<style>
  :root{
    --bg:#0a0d12; --panel:#11161f; --panel2:#0d121a; --board:#0c1118;
    --line:#1e2937; --line2:#26344a;
    --text:#cfd8e3; --muted:#7c8b9e;
    --accent:#f2b544; --ok:#3ddc84; --bad:#ff6b6b; --warn:#ffb454; --blue:#5aa9ff;
    --mono:"Consolas","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;
  }
  button{font:inherit;color:inherit;cursor:pointer}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#243044;border-radius:5px}
  ::-webkit-scrollbar-track{background:transparent}

  .topbar{
    display:flex;align-items:center;gap:16px;height:60px;padding:0 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#121924,#0d1219);
  }
  .brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
  .logo{color:var(--accent);font-size:18px}
  .brand-title{font-weight:700;letter-spacing:.13em;font-size:11.5px}
  .brand-sub{font-size:11px;color:var(--muted)}
  .hstats{display:flex;gap:16px;margin-left:auto}
  .stat{display:flex;flex-direction:column;align-items:flex-end}
  .stat b{font-family:var(--mono);font-size:14px;font-weight:500}
  .stat span{font-size:9.5px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}
  .hbtns{display:flex;gap:7px}
  .btn{
    background:#182231;border:1px solid #2a3a4f;border-radius:6px;
    padding:7px 12px;transition:.15s;white-space:nowrap;font-size:13px;
  }
  .btn:hover{background:#203046;border-color:#3a5170}
  .btn.ghost{background:transparent}
  .btn.primary{background:var(--accent);color:#14181f;border-color:var(--accent);font-weight:600}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.small{padding:4px 9px;font-size:12px}

  .grid{
    display:grid;grid-template-columns:236px minmax(0,1fr) 372px;
    gap:9px;padding:9px;height:calc(100vh - 60px);
  }
  .col{display:flex;flex-direction:column;gap:9px;min-height:0;min-width:0}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:11px;
  }
  h2.ph{
    font-size:9.5px;text-transform:uppercase;letter-spacing:.15em;
    color:var(--muted);margin:0 0 9px;font-weight:600;
  }
  .muted{color:var(--muted)}
  .mono{font-family:var(--mono)}

  /* ---------- задачи ---------- */
  .task{margin-bottom:9px}
  .task-top{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:3px}
  .task-top b{font-family:var(--mono);font-weight:500;color:#9fb0c4;font-size:11.5px}
  .bar{height:4px;background:#192330;border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .task.done .bar i{background:var(--ok)}
  .task.done .task-top b{color:var(--ok)}

  /* ---------- журнал ---------- */
  .logpanel{flex:1;min-height:0;overflow:auto}
  .log{display:flex;flex-direction:column;gap:6px;font-size:11px}
  .log-item{display:flex;gap:6px;color:var(--muted);line-height:1.35}
  .log-time{font-family:var(--mono);color:#46586e;flex-shrink:0}
  .log-item.ok .log-text{color:var(--ok)}
  .log-item.bad .log-text{color:var(--bad)}
  .log-item.warn .log-text{color:var(--warn)}

  /* ---------- карта системы ---------- */
  .map{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px}
  .loc{
    background:#0e141d;border:1px solid #202d3d;border-radius:6px;
    padding:7px 8px;text-align:left;position:relative;transition:.15s;overflow:hidden;
  }
  .loc:hover{border-color:#3a5674;background:#121b27}
  .loc.on{border-color:var(--accent);background:#1a1c15;box-shadow:0 0 0 1px #f2b54444}
  .loc-name{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .loc-count{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}
  .loc.done .loc-count{color:var(--ok)}
  .loc .pulse{
    position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;
    background:var(--accent);opacity:.8;
  }
  .loc.done .pulse{background:var(--ok)}
  .loc.quiet .pulse{display:none}

  /* ---------- доска ---------- */
  .board-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .board-head h2{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:600}
  .board-head .count{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .link-banner{
    flex:1;min-width:220px;display:flex;align-items:center;gap:8px;
    background:#1d1a10;border:1px solid #5c4a1b;border-radius:6px;
    padding:5px 9px;font-size:11.5px;color:#e8c98a;
  }
  .link-banner b{color:var(--accent);font-weight:600}
  .link-banner button{margin-left:auto}

  .board-scroll{
    flex:1;min-height:150px;overflow:auto;border:1px solid var(--line);
    border-radius:8px;background:var(--board);
  }
  .board-inner{
    position:relative;min-height:100%;
    background-image:radial-gradient(#1a2431 1px, transparent 1px);
    background-size:16px 16px;
  }
  #threads{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:visible}
  #threads path{
    fill:none;stroke:#3ddc84;stroke-width:1.4;stroke-dasharray:5 4;
    opacity:.55;animation:dash 12s linear infinite;
  }
  #threads circle{fill:#3ddc84;opacity:.65}
  @keyframes dash{to{stroke-dashoffset:-180}}
  .board{
    position:relative;z-index:1;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(148px,1fr));
    gap:15px;padding:12px;align-content:start;
  }
  .card{
    position:relative;background:#141b26;border:1px solid #263346;
    border-left:3px solid var(--c,#5aa9ff);border-radius:7px;
    padding:8px 9px 22px;text-align:left;transition:transform .12s,box-shadow .12s,border-color .12s;
    min-height:78px;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 7px 18px #0008}
  .card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .card.linked{background:#101a16}
  .card.neighbor{border-color:#3ddc84;box-shadow:0 0 0 1px #3ddc8455, 0 0 16px #3ddc8422}
  .card.flash{animation:flash .9s ease}
  @keyframes flash{
    0%{box-shadow:0 0 0 0 #3ddc84}
    35%{box-shadow:0 0 0 3px #3ddc8499, 0 0 18px #3ddc8455}
    100%{box-shadow:0 0 0 0 transparent}
  }
  .card.src{outline:2px dashed var(--accent);outline-offset:2px}
  .card .c-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
  .card .mark{
    font-family:var(--mono);font-size:9px;width:15px;height:15px;line-height:15px;
    text-align:center;border-radius:3px;background:#0d131b;color:var(--c);
    border:1px solid #26344a;
  }
  .card .c-node{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .c-title{font-size:12.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .c-sub{font-size:10px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .c-link{
    position:absolute;right:6px;bottom:5px;background:transparent;border:1px solid #2b3d54;
    border-radius:4px;font-size:10px;color:#8fb4dd;padding:1px 6px;
  }
  .card .c-link:hover{background:#1c2a3b;color:#cfe4ff}
  .card .c-badge{
    position:absolute;left:9px;bottom:6px;font-size:9.5px;color:var(--ok);
    font-family:var(--mono);
  }
  .card.shake{animation:shake .3s}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-4px)}
    75%{transform:translateX(4px)}
  }
  .board-empty{padding:26px 18px;color:var(--muted);font-size:12.5px;line-height:1.6}
  .board-empty b{color:var(--text);font-weight:600}

  /* ---------- версии ---------- */
  .vwrap{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:9px 11px;max-height:132px;overflow:auto}
  .vwrap.empty{display:none}
  .versions{display:flex;gap:8px}
  .version{
    min-width:186px;max-width:230px;background:#1a1710;border:1px solid #5a4517;
    border-radius:7px;padding:7px 9px;text-align:left;transition:.15s;flex-shrink:0;
  }
  .version:hover{border-color:var(--accent);transform:translateY(-1px)}
  .version .v-k{font-size:8.5px;letter-spacing:.16em;color:var(--accent)}
  .version .v-t{font-size:12px;line-height:1.25;margin:3px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .version .v-m{font-size:10px;color:var(--muted)}
  .version.filed{background:#101a14;border-color:#25553a}
  .version.filed .v-k{color:var(--ok)}
  .version.part{background:#1d1810;border-color:#4d3f1c}
  .version.part .v-k{color:var(--warn)}

  /* ---------- детали ---------- */
  .detailpanel{flex:1;min-height:0;overflow:auto}
  .breadcrumb{
    background:transparent;border:none;color:var(--muted);font-size:11.5px;
    padding:0;margin-bottom:8px;
  }
  .breadcrumb:hover{color:var(--accent)}
  .d-head{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .mark-big{
    font-family:var(--mono);font-size:10px;width:20px;height:20px;line-height:20px;
    text-align:center;border-radius:4px;background:#0d131b;color:var(--c);
    border:1px solid #26344a;flex-shrink:0;
  }
  .d-node{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
  .detailpanel h2{font-size:16px;margin:0 0 2px;line-height:1.25}
  .detailpanel .sub{color:var(--muted);font-size:11.5px;margin-bottom:12px}
  .fields{display:grid;grid-template-columns:104px 1fr;gap:5px 9px;font-size:12px;margin:0}
  .fields dt{color:var(--muted)}
  .fields dd{margin:0;font-family:var(--mono);font-size:11.5px;word-break:break-word}
  .note{
    margin:12px 0;padding:9px 11px;border-left:2px solid #33465e;
    background:#0d1219;color:#9fb0c4;font-size:11.5px;font-style:italic;
  }
  .clue{
    margin:12px 0;padding:9px 11px;border-left:2px solid var(--accent);
    background:#1a1710;color:#e8c98a;font-size:12px;
  }
  .clue b{color:var(--accent);font-size:9px;letter-spacing:.13em;display:block;margin-bottom:3px}
  .d-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .linklist{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
  .linklist li{margin-bottom:3px}

  .elem-list{display:flex;flex-direction:column;gap:5px;margin-top:10px}
  .elem{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    background:#0d1219;border:1px solid #1b2634;border-radius:5px;
    padding:7px 9px;text-align:left;font-size:12px;width:100%;
  }
  .elem:hover{border-color:#2f4a68;background:#111a26}
  .elem .e-sub{font-size:10px;color:var(--muted)}
  .elem .e-ok{font-size:9.5px;color:var(--ok);font-family:var(--mono)}
  .elem .e-new{font-size:9.5px;color:var(--muted);font-family:var(--mono)}

  .v-badge{
    display:inline-block;font-size:9px;letter-spacing:.14em;color:var(--accent);
    border:1px solid #5a4517;background:#1a1710;border-radius:4px;padding:2px 6px;margin-bottom:8px;
  }
  .v-evidence{margin:10px 0;padding:0;list-style:none}
  .v-evidence li{
    font-size:12px;padding:5px 0 5px 16px;position:relative;border-bottom:1px solid #17212d;
  }
  .v-evidence li:before{content:"◦";position:absolute;left:2px;color:var(--accent)}
  .status-box{margin-top:10px;padding:9px 11px;border-radius:6px;font-size:12px;
    background:#122119;border:1px solid #1f4430}
  .status-box.part{background:#241d10;border-color:#4a3a17;color:var(--warn)}

  /* ---------- модалки ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,7,11,.8);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;padding:18px;z-index:50;
  }
  .modal{
    background:var(--panel);border:1px solid #2a3a4f;border-radius:10px;
    padding:20px;max-width:620px;width:100%;max-height:88vh;overflow:auto;
    box-shadow:0 30px 80px #0008;
  }
  .modal.wide{max-width:860px}
  .modal h2{margin:2px 0 8px;font-size:19px}
  .modal h3{margin:0 0 4px;font-size:15px}
  .modal p{margin:0 0 11px;font-size:13px;color:#b6c3d3}
  .kicker{font-size:9.5px;letter-spacing:.2em;color:var(--accent);margin-bottom:5px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .field-label{font-size:9.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);margin:15px 0 7px}

  .steps{display:flex;flex-direction:column;gap:12px;margin:14px 0}
  .step{display:flex;gap:11px}
  .step-n{
    width:24px;height:24px;border-radius:50%;background:#1a1710;border:1px solid #5a4517;
    color:var(--accent);font-family:var(--mono);font-size:12px;line-height:23px;text-align:center;flex-shrink:0;
  }
  .step-t{font-size:12.5px;color:#b6c3d3;line-height:1.45}
  .step-t b{color:var(--text)}

  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{background:#101822;border:1px solid #26374b;border-radius:6px;padding:8px 13px;font-size:12.5px}
  .chip.on{border-color:var(--accent);background:#221d12;color:#f5d08a}
  .opt{
    display:block;width:100%;text-align:left;margin-bottom:6px;
    background:#101822;border:1px solid #26374b;border-radius:6px;
    padding:9px 11px;font-size:12.5px;
  }
  .opt:hover{border-color:#3b5673}
  .opt.on{border-color:var(--accent);background:#221d12;color:#f5d08a}

  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:9.5px;
     text-transform:uppercase;letter-spacing:.08em;padding:5px 7px;border-bottom:1px solid var(--line)}
  td{padding:6px 7px;border-bottom:1px solid #17212d}
  .act-table input{accent-color:var(--accent);width:15px;height:15px}

  .score{display:flex;gap:20px;align-items:baseline;margin:4px 0 12px}
  .score-num{font-family:var(--mono);font-size:40px;color:var(--accent);line-height:1}
  .score-grade{font-size:13px;color:var(--muted)}
  .res-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;
    border-bottom:1px solid #17212d;font-size:12px}
  .res-row .ok{color:var(--ok)}
  .res-row .part{color:var(--warn)}
  .res-row .miss{color:var(--bad)}
  .hintlist{margin:6px 0 0;padding-left:18px;font-size:12px;color:#a9b8ca}
  .hintlist li{margin-bottom:4px}

  #toast-root{position:fixed;right:14px;bottom:14px;top:auto;left:auto;transform:none;
    display:flex;flex-direction:column;gap:7px;z-index:100;align-items:stretch;
    width:min(370px,calc(100vw - 28px))}
  .toast{
    background:#1a2432;border:1px solid #33465e;border-left:3px solid var(--blue);
    padding:9px 14px;border-radius:6px;font-size:12.5px;max-width:100%;
    box-shadow:0 12px 30px #0008;animation:rise .2s ease;
  }
  .toast.ok{border-left-color:var(--ok)}
  .toast.bad{border-left-color:var(--bad)}
  .toast.warn{border-left-color:var(--warn)}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  @media (max-width:1240px){
    .grid{grid-template-columns:214px minmax(0,1fr) 330px}
    .brand-sub{display:none}
  }
  @media (max-width:980px){
    body{overflow:auto}
    .grid{grid-template-columns:1fr;height:auto}
    .col{min-height:0}
    .board-scroll{height:46vh}
    .logpanel{max-height:180px}
    .topbar{flex-wrap:wrap;height:auto;padding:9px 12px;gap:9px}
    .hstats{margin-left:0}
    #toast-root{left:14px;right:14px;bottom:14px;width:auto}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo">◆</span>
    <div>
      <div class="brand-title">НАСЛЕДСТВО АДМИНА</div>
      <div class="brand-sub">Дело 1 · «Опись» · ООО «Стабильность-С»</div>
    </div>
  </div>
  <div class="hstats">
    <div class="stat"><b id="h-clock">09:00</b><span>смена</span></div>
    <div class="stat"><b id="h-ev">0/18</b><span>улики</span></div>
    <div class="stat"><b id="h-links">0/10</b><span>связки</span></div>
    <div class="stat"><b id="h-vers">0/7</b><span>версии</span></div>
  </div>
  <div class="hbtns">
    <button class="btn ghost small" data-act="help" title="Как играть">?</button>
    <button class="btn ghost" data-act="open-act">Акт</button>
    <button class="btn primary" data-act="finish">Сдать дело</button>
  </div>
</header>

<main class="grid">
  <aside class="col">
    <section class="panel">
      <h2 class="ph">Задачи смены</h2>
      <div id="tasks"></div>
    </section>
    <section class="panel logpanel">
      <h2 class="ph">Журнал</h2>
      <div class="log" id="log"></div>
    </section>
  </aside>

  <section class="col">
    <div class="map" id="map"></div>
    <div class="board-head">
      <h2>Доска улик</h2>
      <span class="count" id="board-count"></span>
      <div id="link-banner"></div>
    </div>
    <div class="board-scroll" id="board-scroll">
      <div class="board-inner" id="board-inner">
        <svg id="threads"></svg>
        <div class="board" id="board"></div>
      </div>
    </div>
    <div class="vwrap empty" id="vwrap">
      <div class="versions" id="versions"></div>
    </div>
  </section>

  <aside class="col">
    <div class="panel detailpanel" id="detail"></div>
  </aside>
</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
"use strict";

/* ============================ ДАННЫЕ ============================ */

const LOCS = ["Серверная", "ИТ-кабинет", "Бухгалтерия", "Ресепшн", "Филиал"];

const TOOLMETA = {
  accounts:{ label:"Учётка", mark:"У", color:"#5aa9ff" },
  logs:    { label:"Журнал", mark:"Ж", color:"#a48cff" },
  net:     { label:"Сеть",   mark:"С", color:"#3ddc84" },
  tasks:   { label:"Задача", mark:"З", color:"#f2b544" },
};

const ART = [
  { id:"u01", tool:"accounts", node:"Серверная", title:"gribov", sub:"Учётная запись · домен STAB",
    fields:[["Логин","gribov"],["Роль","Администратор домена"],["Владелец","Грибов И. Н. (уволен 05.11)"],["Создана","12.07.2017"],["Последний вход","04.11 17:02"],["Статус","Активна"]],
    note:"В профиле — папка «ДИПЛОМ_финал_2_НОВЫЙ». Внутри пусто.",
    clue:"Учётная запись администратора домена принадлежит уволенному сотруднику и остаётся активной." },

  { id:"u02", tool:"accounts", node:"Серверная", title:"support_old", sub:"Учётная запись · домен STAB",
    fields:[["Логин","support_old"],["Роль","Администратор домена"],["Владелец","— не указан"],["Создана","14.03.2019"],["Последний вход","25.11 03:41"],["Статус","Активна"],["Описание","«Служебная. Не удалять.»"]],

const state = {
  sel:null,               // {type:'loc'|'artifact'|'version', id}
  studied:new Set(),
  links:{},
  versions:{},            // anchor -> true (объявлена)
  filed:{},               // anchor -> {partial}
  linkFrom:null,

  minutes:0,
  log:[],

  finished:false,
};

let _ff = { anchor:null, verdict:null, action:null };

const START_MIN = 9 * 60;

function clockStr(){
  const t = START_MIN + state.minutes;
  return String(Math.floor(t / 60) % 24).padStart(2,"0") + ":" + String(t % 60).padStart(2,"0");
}
function log(kind, text){
  state.log.unshift({ kind, text, time:clockStr() });
  state.log = state.log.slice(0, 40);
}
function addMinutes(n){ state.minutes += n; }
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function versionReady(anchor){
  const f = FINDINGS.find(x => x.anchor === anchor);
  return f.links.every(l => !!state.links[linkKey(l.a, l.b)]);
}
function filedCount(){ return Object.keys(state.filed).length; }
function linkCountOf(id){ return Object.keys(state.links).filter(k => state.links[k].a === id || state.links[k].b === id).length; }

/* ============================ РЕНДЕР ============================ */

function render(){
  document.getElementById("h-clock").textContent = clockStr();
  document.getElementById("h-ev").textContent = state.studied.size + "/" + ART.length;
  document.getElementById("h-links").textContent = Object.keys(state.links).length + "/" + TOTAL_LINKS;
  document.getElementById("h-vers").textContent = filedCount() + "/" + FINDINGS.length;

  renderTasks();
  renderMap();
  renderBoardHead();
  renderBoard();
  renderVersions();
  renderDetail();
  renderLog();

  drawThreads();
  requestAnimationFrame(drawThreads);
}

function renderTasks(){
  const studied = state.studied.size;
  const links = Object.keys(state.links).length;
  const filed = filedCount();
  const actDone = !!state.act;

  const rows = [
    { label:"Изучить систему", value:studied, max:ART.length, done:studied === ART.length },
    { label:"Сопоставить улики", value:links, max:TOTAL_LINKS, done:links === TOTAL_LINKS },
    { label:"Оформить версии", value:filed, max:FINDINGS.length, done:filed === FINDINGS.length },
    { label:"Заполнить акт", value:actDone ? 1 : 0, max:1, done:actDone },
  ];

  document.getElementById("tasks").innerHTML = rows.map(r => {
    const pct = r.max ? Math.round(100 * r.value / r.max) : 0;
    return '<div class="task ' + (r.done ? "done" : "") + '">' +
      '<div class="task-top"><span>' + esc(r.label) + '</span><b>' + r.value + "/" + r.max + '</b></div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '</div>';
  }).join("");
}

function renderMap(){
  document.getElementById("map").innerHTML = LOCS.map(loc => {
    const all = ART.filter(a => a.node === loc);
    const done = all.filter(a => state.studied.has(a.id)).length;
    const cls = (state.sel && state.sel.type === "loc" && state.sel.id === loc ? "on " : "") +
                (done === all.length ? "done " : "") +
                (done === 0 ? "quiet" : "");
    return '<button class="loc ' + cls + '" data-act="loc" data-id="' + esc(loc) + '">' +
      '<span class="loc-name">' + esc(loc) + '</span>' +
      '<span class="loc-count">' + done + "/" + all.length + '</span>' +
      '<span class="pulse"></span>' +
      '</button>';
  }).join("");
}

function renderBoardHead(){
  document.getElementById("board-count").textContent = state.studied.size + " карточек";
  const box = document.getElementById("link-banner");
  if(state.linkFrom){
    box.innerHTML = '<div class="link-banner">' +
      'Сопоставляем: <b>' + esc(BY_ID[state.linkFrom].title) + '</b> — выберите вторую улику' +
      '<button class="btn ghost small" data-act="link-cancel">Отмена</button></div>';
  } else {
    box.innerHTML = "";
  }
}

function renderBoard(){
  const box = document.getElementById("board");
  const items = ART.filter(a => state.studied.has(a.id));
  if(!items.length){
    box.innerHTML = '<div class="board-empty" style="grid-column:1/-1">' +
      '<b>Доска пуста.</b><br>Откройте локацию на карте сверху и изучите то, что там есть. ' +
      'Изученное появится здесь и станет уликой.<br><br>' +
      '<span class="muted">Дальше улики можно сопоставлять: кнопка «связь» на карточке.</span>' +
      '</div>';
    return;
  }
  box.innerHTML = items.map(a => {
    const tm = TOOLMETA[a.tool];
    const lc = linkCountOf(a.id);
    const selId = state.sel && state.sel.type === "artifact" ? state.sel.id : null;
    const isNeighbor = selId && selId !== a.id && Object.values(state.links).some(l =>
      (l.a === selId && l.b === a.id) || (l.b === selId && l.a === a.id)
    );
    const cls = [
      state.sel && state.sel.type === "artifact" && state.sel.id === a.id ? "sel" : "",
      lc ? "linked" : "",
      isNeighbor ? "neighbor" : "",
      state.linkFrom === a.id ? "src" : "",
    ].filter(Boolean).join(" ");
    return '<div class="card ' + cls + '" data-act="card" data-id="' + a.id + '" data-card="' + a.id + '" style="--c:' + tm.color + '" tabindex="0">' +
      '<div class="c-top"><span class="mark">' + tm.mark + '</span><span class="c-node">' + esc(a.node) + '</span></div>' +
      '<div class="c-title">' + esc(a.title) + '</div>' +
      '<div class="c-sub">' + esc(tm.label) + '</div>' +
      (lc ? '<span class="c-badge">связей: ' + lc + '</span>' : '') +
      '<button class="c-link" data-act="link-start" data-id="' + a.id + '" title="Связать с другой уликой">связь</button>' +
      '</div>';
  }).join("");

/* ============================ СВЯЗИ НА ДОСКЕ ============================ */

function flashCards(a, b){
  [a, b].forEach(id => {
    const el = document.querySelector('[data-card="' + id + '"]');
    if(!el) return;
    el.classList.add("flash");
    setTimeout(() => el.classList.remove("flash"), 900);
  });
}

function drawThreads(){
  const inner = document.getElementById("board-inner");
  const svg = document.getElementById("threads");
  if(!inner || !svg) return;
  const ir = inner.getBoundingClientRect();
  svg.setAttribute("width", inner.scrollWidth);
  svg.setAttribute("height", inner.scrollHeight);

  let out = "";
  Object.keys(state.links).forEach(k => {
    const l = state.links[k];
    const A = inner.querySelector('[data-card="' + l.a + '"]');
    const B = inner.querySelector('[data-card="' + l.b + '"]');
    if(!A || !B) return;
    const ra = A.getBoundingClientRect();
    const rb = B.getBoundingClientRect();
    const ax = ra.left - ir.left + ra.width / 2;
    const ay = ra.top - ir.top + ra.height / 2;
    const bx = rb.left - ir.left + rb.width / 2;
    const by = rb.top - ir.top + rb.height / 2;

    const p1 = edgePoint(ra, ir, ax, ay, bx, by);
    const p2 = edgePoint(rb, ir, bx, by, ax, ay);

    const dx = p2.x - p1.x, dy = p2.y - p1.y;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    const sag = 6;
    const mx = (p1.x + p2.x) / 2 - dy / len * sag;
    const my = (p1.y + p2.y) / 2 + dx / len * sag;

    out += '<path d="M' + p1.x.toFixed(1) + ',' + p1.y.toFixed(1) +
      ' Q' + mx.toFixed(1) + ',' + my.toFixed(1) + ' ' + p2.x.toFixed(1) + ',' + p2.y.toFixed(1) + '" />' +
      '<circle cx="' + p1.x.toFixed(1) + '" cy="' + p1.y.toFixed(1) + '" r="2.4" />' +
      '<circle cx="' + p2.x.toFixed(1) + '" cy="' + p2.y.toFixed(1) + '" r="2.4" />';
  });
  svg.innerHTML = out;
}

function edgePoint(rect, ir, cx, cy, tx, ty){
  const dx = tx - cx, dy = ty - cy;
  const hw = rect.width / 2 + 1;
  const hh = rect.height / 2 + 1;
  const sx = dx === 0 ? Infinity : hw / Math.abs(dx);
  const sy = dy === 0 ? Infinity : hh / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}

function attemptLink(from, to){
  if(from === to){ toast("Выберите другую улику."); return; }
  const k = linkKey(from, to);
  if(state.links[k]){ toast("Эти улики уже связаны."); return; }

  addMinutes(3);
  const def = LINK_DEFS[k];
  state.linkFrom = null;

  if(!def){
    log("warn", "Связь не подтвердилась: " + BY_ID[from].title + " / " + BY_ID[to].title);
    render();
    toast("Данные не сходятся. Связь не подтверждена.", "warn");
    return;
  }

  state.links[k] = def;
  log("ok", "Связка: " + BY_ID[def.a].title + " / " + BY_ID[def.b].title);
  render();
  flashCards(def.a, def.b);
  toast(def.text, "ok", 6500);

  const anchor = def.finding;
  if(versionReady(anchor) && !state.versions[anchor]){
    state.versions[anchor] = true;
    const f = FINDINGS.find(x => x.anchor === anchor);
    log("ok", "Собрана версия: " + f.title);
    toast("Собрана версия: «" + f.title + "». Она появилась под доской.", "ok", 6000);
  }
}

function submitVersion(){
  const { anchor, verdict, action } = _ff;
  if(!verdict){ toast("Выберите вердикт.", "warn"); return; }
  if(!action){ toast("Выберите действие.", "warn"); return; }

  const f = FINDINGS.find(x => x.anchor === anchor);

  if(verdict !== f.verdict){
    state.penalties += 5;
    log("bad", "Неверный вердикт: " + f.title);
    render();
    toast("Вердикт не подтверждается собранными уликами. −5", "bad");
    return;
  }

  addMinutes(5);
  const correct = action === f.correctAction;
  state.filed[anchor] = { partial:!correct };

  if(correct){
    log("ok", "Версия оформлена: " + f.title);
    toast("Версия оформлена.", "ok");
  } else {
    const inc = f.incidents[action] || "Действие привело к последствиям.";
    state.incidents.push(inc);
    log("bad", "Инцидент: " + inc);
    toast("Вердикт верный, действие — нет. Это будет иметь последствия.", "warn");
  }

  closeModal();
  render();
}

/* ============================ ИТОГИ ============================ */

function isResolved(anchor){
  const rec = state.filed[anchor];
  return !!rec && !rec.partial;
}

function computeResults(){
  const rows = [];
  let findingsScore = 0;

  FINDINGS.forEach(f => {
    const rec = state.filed[f.anchor];
    if(!rec){ rows.push({ title:f.title, status:"не оформлена", kind:"miss" }); return; }
    if(rec.partial){
      findingsScore += 4;
      rows.push({ title:f.title, status:"действие неверное", kind:"part" });
    } else {
      findingsScore += 10;
      rows.push({ title:f.title, status:"верно", kind:"ok" });
    }
  });

  let actScore = 0;
  let actNote = "акт не заполнен";
  if(state.act){
    const critAll = ASSETS.filter(a => a.critical);
    const ownAll  = ASSETS.filter(a => a.unowned);
    const critSel = ASSETS.filter(a => state.act.crit[a.id]);
    const ownSel  = ASSETS.filter(a => state.act.unowned[a.id]);
    const critHit = critSel.filter(a => a.critical).length;
    const ownHit  = ownSel.filter(a => a.unowned).length;
    const critErr = ASSETS.filter(a => !!state.act.crit[a.id] !== !!a.critical).length;
    const ownErr  = ASSETS.filter(a => !!state.act.unowned[a.id] !== !!a.unowned).length;

    actScore = Math.max(0,
      Math.round(10 * (1 - critErr / ASSETS.length)) +
      Math.round(10 * (1 - ownErr / ASSETS.length))
    );
    actNote = "критичные " + critHit + "/" + critAll.length +
      (critSel.length > critHit ? ", лишних " + (critSel.length - critHit) : "") +
      " · без владельца " + ownHit + "/" + ownAll.length +
      (ownSel.length > ownHit ? ", лишних " + (ownSel.length - ownHit) : "");
  }

  const timeBonus = (filedCount() === 0 && !state.act) ? 0 :
    state.minutes <= 120 ? 10 : state.minutes <= 180 ? 6 : state.minutes <= 240 ? 3 : 0;
  const total = Math.max(0, findingsScore + actScore + timeBonus - state.penalties);
  const grade = total >= 90 ? "Отлично" : total >= 70 ? "Зачёт" : total >= 50 ? "Условно" : "Дело возвращено";

  const consequences = [];
  if(!isResolved("u02") || !isResolved("t01"))
    consequences.push("Дело 3: ночью шифруется файловый сервер FS-01. Простой — два дня.");
  if(state.filed["t02"] && state.filed["t02"].partial)
    consequences.push("1С падает, бухгалтерия простаивает, директор требует объяснений.");
  if(state.filed["u01"] && state.filed["u01"].partial)
    consequences.push("Дело 4: резервных копий нет. Восстанавливать не из чего.");
  if(!isResolved("n03"))
    consequences.push("Дело 5: аудитор находит сканы паспортов в открытой папке. Акт не подписан.");
  if(!isResolved("u03"))
    consequences.push("Дело 5: действия сотрудников неразличимы, инцидент не атрибутируется.");
  if(!state.act)
    consequences.push("Акт не сдан: при проверке система числится неучтённой.");

  return { rows, findingsScore, actScore, actNote, timeBonus, total, grade, consequences };
}

function finish(){
  const r = computeResults();

  try{
    localStorage.setItem("nasledstvo.case1", JSON.stringify({
      score:r.total, grade:r.grade, consequences:r.consequences,
      incidents:state.incidents, date:new Date().toISOString(),
    }));
  }catch(e){}

  const incidentsHtml = state.incidents.length
    ? state.incidents.map(i => '<div class="res-row"><span>' + esc(i) + '</span><span class="miss">инцидент</span></div>').join("")
    : '<div class="muted" style="font-size:12px">Инцидентов нет.</div>';

  const consHtml = r.consequences.length
    ? r.consequences.map(c => '<li>' + esc(c) + '</li>').join("")
    : '<li>Ничего не сломано. Пока.</li>';

  openModal(
    '<div class="kicker">ДЕЛО 1 · ИТОГИ</div>' +
    '<div class="score"><span class="score-num">' + r.total + '</span>' +
    '<span class="score-grade">' + esc(r.grade) + ' · смена завершена в ' + clockStr() + '</span></div>' +
    '<div class="res-row"><span>Версии</span><span>' + r.findingsScore + ' / 70</span></div>' +
    '<div class="res-row"><span>Акт</span><span>' + r.actScore + ' / 20 <span class="muted">(' + esc(r.actNote) + ')</span></span></div>' +
    '<div class="res-row"><span>Время</span><span>' + r.timeBonus + ' / 10 <span class="muted">(' + state.minutes + ' мин)</span></span></div>' +
    '<div class="res-row"><span>Связки</span><span>' + Object.keys(state.links).length + ' / ' + TOTAL_LINKS + '</span></div>' +
    '<div class="res-row"><span>Штрафы</span><span class="miss">−' + state.penalties + '</span></div>' +

    '<div class="field-label">Разбор версий</div>' +
    r.rows.map(row => '<div class="res-row"><span>' + esc(row.title) + '</span>' +
      '<span class="' + row.kind + '">' + esc(row.status) + '</span></div>').join("") +

    '<div class="field-label">Журнал происшествий</div>' + incidentsHtml +

    '<div class="field-label">Что это будет значить дальше</div>' +
    '<ul class="hintlist">' + consHtml + '</ul>' +

    '<div class="modal-actions">' +

      '<button class="btn primary" data-act="close">Закрыть</button>' +
    '</div>',
    "wide", true
  );
}

    '<p>ООО «Стабильность-С», 45 человек. Единственный админ уволился три недели назад и не передал документацию. Директор: «Работает же. Разберитесь, что у нас есть и кто туда заходит».</p>' +
    '<div class="steps">' +
      '<div class="step"><div class="step-n">1</div><div class="step-t"><b>Открывайте локации.</b> Карта сверху — это система. Внутри локации лежат объекты: учётки, журналы, соединения, задачи. Изученное попадает на доску улик.</div></div>' +
      '<div class="step"><div class="step-n">2</div><div class="step-t"><b>Связывайте улики.</b> Нажмите «связь» на карточке и выберите вторую. Связь подтвердится, только если данные действительно сходятся. Это и есть «два источника».</div></div>' +
      '<div class="step"><div class="step-n">3</div><div class="step-t"><b>Оформляйте версию.</b> Когда улик достаточно, под доской появляется версия: назовите её своим именем — закладка, нарушение или костыль — и выберите действие.</div></div>' +
      '<div class="step"><div class="step-n">4</div><div class="step-t"><b>Заполните акт и сдайте дело.</b> Действия имеют последствия: что-то можно уронить. Подсказок нет.</div></div>' +
    '</div>' +
    '<div class="modal-actions"><button class="btn primary" data-act="' + (first ? "start" : "close") + '">' +
      (first ? "Начать смену" : "Понятно") + '</button></div>',
    null, true
  );
}

/* ============================ СОБЫТИЯ ============================ */

document.addEventListener("click", (e) => {
  if(e.target.classList && e.target.classList.contains("overlay")){
    const modal = e.target.querySelector(".modal");
    if(modal && !modal.dataset.static) closeModal();
  }

  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  switch(act){
    case "start": closeModal(); log("info", "Смена начата. Объект принят без документации."); render(); break;
    case "help": helpModal(false); break;
    case "system": selectSystem(); break;
    case "loc": selectLoc(id); break;
    case "open": openArtifact(id); break;
    case "card":
      if(state.linkFrom) attemptLink(state.linkFrom, id);
      else openArtifact(id);
      break;
    case "link-start": startLink(id); break;
    case "link-cancel": cancelLink(); break;
    case "version": state.sel = { type:"version", id }; render(); break;
    case "file-version": openVersionForm(id); break;
    case "verdict": _ff.verdict = id; _ff.action = null; renderFindingActions(); break;
    case "action": _ff.action = id; renderFindingActions(); break;
    case "submit-version": submitVersion(); break;
    case "open-act": openAct(); break;
    case "save-act": saveAct(); break;
    case "finish": finish(); break;
    case "close": closeModal(); break;
    case "restart": location.reload(); break;
  }
});

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    if(state.linkFrom){ cancelLink(); return; }
    const root = document.getElementById("modal-root");
    const modal = root.querySelector(".modal");
    if(modal && !modal.dataset.static) closeModal();
  }
});

window.addEventListener("resize", () => requestAnimationFrame(drawThreads));
document.getElementById("board-scroll").addEventListener("scroll", () => {
  // линии привязаны к контенту и скроллятся вместе с ним
});

/* ============================ СТАРТ ============================ */

render();
helpModal(true);
</script>
</body>
</html>
